# Local development stack. Start with `just up` (it exports HOST_UID/HOST_GID for you).
name: kidana-qa

services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: kidana
      POSTGRES_PASSWORD: kidana
      POSTGRES_DB: kidana_qa
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidana -d kidana_qa"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: dev
    image: kidana-qa-dev
    # Run as the host user so generated files (templ, sqlc, css) are not owned by root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://kidana:kidana@db:5432/kidana_qa?sslmode=disable
      TEST_DATABASE_URL: postgres://kidana:kidana@db:5432/kidana_qa_test?sslmode=disable
      UPLOAD_DIR: /data/uploads
      GOPATH: /go-mod/gopath
    volumes:
      # :z relabels for SELinux (Fedora / Bluefin); harmless elsewhere.
      - .:/app:z
      - gocache:/go-cache
      - gomod:/go-mod
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  gocache:
  gomod:
  uploads:
