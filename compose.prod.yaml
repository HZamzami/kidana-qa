# Production stack (single server). Put a TLS-terminating reverse proxy
# (Caddy, nginx, Traefik) in front of `app` and set SESSION_SECURE=true.
#
#   cp .env.example .env.prod   # set ADMIN_*, POSTGRES_PASSWORD, etc.
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
name: kidana-quality-prod

services:
  db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kidana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kidana_quality
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidana -d kidana_quality"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: prod
    image: kidana-quality:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://kidana:${POSTGRES_PASSWORD}@db:5432/kidana_quality?sslmode=disable
      SESSION_SECURE: ${SESSION_SECURE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-مدير النظام}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Nightly logical backup, keeps 14 days. Copy ./backups off the server regularly.
  backup:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups:z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/kidana_quality_$$(date +%Y%m%d_%H%M).dump
          pg_dump -h db -U kidana -d kidana_quality -Fc -f "$$f" && echo "backup ok: $$f"
          find /backups -name 'kidana_quality_*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
