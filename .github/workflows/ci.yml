name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: kidana
          POSTGRES_PASSWORD: kidana
          POSTGRES_DB: kidana_quality_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kidana" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://kidana:kidana@localhost:5432/kidana_quality_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install templ and sqlc
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1118
          curl -fsSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin sqlc

      - name: Generated code is up to date
        run: |
          templ generate
          sqlc generate
          git diff --exit-code -- '*.go'

      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          tags: kidana-quality:ci
